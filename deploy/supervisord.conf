; supervisord process tree for the extractor PoC inside a single RunPod container.
; Children inherit supervisord's environment (API_KEY, ALLOWED_ORIGINS, PATH, HOME
; exported by start.sh); per-program `environment=` only ADDS to that.

[supervisord]
nodaemon=true
logfile=/var/log/extractor/supervisord.log
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:redis]
command=redis-server --appendonly yes --dir %(ENV_REDIS_DIR)s
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/extractor/redis.log
stderr_logfile=/var/log/extractor/redis.log

[program:ollama]
command=ollama serve
environment=OLLAMA_HOST="0.0.0.0:11434"
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/extractor/ollama.log
stderr_logfile=/var/log/extractor/ollama.log

[program:api]
directory=%(ENV_APP_DIR)s
command=uv run uvicorn main:app --host 0.0.0.0 --port 8000
environment=REDIS_URL="redis://localhost:6379/0",OLLAMA_HOST="http://localhost:11434"
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/extractor/api.log
stderr_logfile=/var/log/extractor/api.log

[program:worker]
directory=%(ENV_APP_DIR)s
command=uv run python worker.py
environment=REDIS_URL="redis://localhost:6379/0",OLLAMA_HOST="http://localhost:11434"
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/extractor/worker.log
stderr_logfile=/var/log/extractor/worker.log

[program:cloudflared]
command=%(ENV_APP_DIR)s/deploy/cloudflared-run.sh
autostart=%(ENV_ENABLE_TUNNEL)s
autorestart=true
priority=30
stdout_logfile=/var/log/extractor/cloudflared.log
stderr_logfile=/var/log/extractor/cloudflared.log
