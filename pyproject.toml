[project]
name = "extractor-app"
version = "0.1.0"
description = "PoC FastAPI service for SRIKANDI naskah dinas extraction (Docling parse + Ollama LLM extract)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "docling>=2.0,<3",
    "ollama>=0.4",
    "redis>=5.0",
    "rq>=2.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27",  # for testing FastAPI TestClient
]
